[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback so refreshing any in-app path returns index.html
# (hash router already handles client-side, but this covers direct loads).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache static assets (Vite hashes filenames, so cache-bust is automatic).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Day-cache templates so users don't re-download .docx on every CV generation.
[[headers]]
  for = "/templates/*.docx"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/vnd.openxmlformats-officedocument.wordprocessingml.document"

# Service worker MUST have a no-cache header so PWA updates roll out
# immediately when a new version is deployed.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
