[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — any path that doesn't match a file falls back to index.html
# so client-side router can handle it. Hash-router already works, but this
# covers direct deep-link loads too.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache hashed Vite assets — filenames carry a hash, so cache-bust is
# automatic on the next build.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Templates (.docx) — cache 1 day. New templates pushed in git will roll out
# next day; faster cache-bust if you append ?v=N in code.
[[headers]]
  for = "/templates/*.docx"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/vnd.openxmlformats-officedocument.wordprocessingml.document"

# Service worker MUST NOT be cached or PWA updates never reach users.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"
